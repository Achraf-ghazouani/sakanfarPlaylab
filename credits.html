<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbfaff">
<title>Get more credits · Sakanfar PlayLab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#fbfaff; --lav:#efeaff; --lav-2:#e2d9ff; --purple:#7c3aed; --purple-deep:#5b21b6; --ink:#1b1535; --muted:#6b6480; --line:#ebe6f7; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px 16px; background:var(--bg); color:var(--ink); font-family:Inter, system-ui, sans-serif; }
  .card { width:min(520px, 100%); background:#fff; border:1px solid var(--line); border-radius:22px; padding:28px 24px; text-align:center; box-shadow:0 20px 50px rgba(91,33,182,.10); }
  h1 { font-family:Fredoka, sans-serif; margin:10px 0 8px; }
  p { color:var(--muted); line-height:1.55; }
  .coin { font-size:54px; }
  a { display:inline-block; margin:8px 4px 0; border-radius:999px; padding:10px 16px; font-weight:600; text-decoration:none; border:1px solid var(--lav-2); color:var(--purple-deep); }
  a.primary { background:var(--purple); color:#fff; border-color:var(--purple); }
</style>
</head>
<body>
<main class="card">
  <div class="coin">&#129689;</div>
  <h1>More credits are coming</h1>
  <p>Credit packs and payments arrive after the beta. Running low right now? Write to us and we will top up your account.</p>
  <a class="primary" href="mailto:contact@sakanfarproductions.com?subject=PlayLab%20credits">Ask for credits</a>
  <a href="profile.html">Back to my profile</a>
</main>
</body>
</html>
