<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>PlayLab Arena</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<script src="shared/joystick.js"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#111; font-family:system-ui, sans-serif; color:#eee; user-select:none; -webkit-user-select:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; cursor:crosshair; }
  #hud { position:fixed; top:0; left:0; right:0; height:44px; box-sizing:border-box; display:flex; gap:10px; align-items:center; padding:0 12px; background:rgba(0,0,0,.6); font-size:14px; z-index:2; }
  #hud .btn, #hud button { font-size:13px; padding:5px 11px; border-radius:999px; border:0; background:#2b6cff; color:#fff; cursor:pointer; text-decoration:none; white-space:nowrap; }
  #homeBtn { background:transparent; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
  .seg { display:inline-flex; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.12); }
  .seg button { border-radius:0 !important; background:transparent !important; opacity:.75; }
  .seg button.on { background:#7c3aed !important; opacity:1; font-weight:700; }
  #theme { color:#bbb; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #stats { margin-left:auto; display:flex; gap:14px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #stats small { font-weight:400; color:#bbb; }
  #vitals { position:fixed; left:14px; bottom:14px; z-index:2; display:flex; gap:14px; align-items:center; background:rgba(0,0,0,.55); padding:8px 12px; border-radius:12px; font-weight:700; }
  #hpbar { width:160px; height:12px; background:rgba(255,255,255,.15); border-radius:999px; overflow:hidden; }
  #hp { height:100%; width:100%; background:#22c55e; border-radius:999px; transition:width .15s, background .15s; }
  #cross { position:fixed; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px; pointer-events:none; z-index:2; opacity:.9; }
  #cross::before, #cross::after { content:""; position:absolute; background:#fff; box-shadow:0 0 2px #000; }
  #cross::before { left:10px; top:0; width:2px; height:22px; } #cross::after { top:10px; left:0; width:22px; height:2px; }
  body.top #cross { display:none; }
  #hurt { position:fixed; inset:0; pointer-events:none; z-index:1; background:radial-gradient(ellipse at center, transparent 55%, rgba(220,38,38,.55)); opacity:0; transition:opacity .25s; }
  #msg { position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:3; }
  #msg.show { display:flex; }
  #msg div { background:rgba(0,0,0,.78); color:#fff; padding:22px 34px; border-radius:14px; text-align:center; font-size:30px; font-weight:700; cursor:pointer; max-width:80vw; }
  #msg small { display:block; font-size:15px; font-weight:400; margin-top:8px; color:#ccc; line-height:1.5; }
  #hint { position:fixed; bottom:10px; right:14px; font-size:12px; color:rgba(255,255,255,.7); z-index:2; pointer-events:none; text-align:right; }
  #wave { position:fixed; left:50%; top:60px; transform:translateX(-50%); font-size:34px; font-weight:800; text-shadow:0 2px 10px #000; opacity:0; transition:opacity .3s; pointer-events:none; z-index:2; }
  #wave.show { opacity:1; }
  body.embed #homeBtn, body.embed #hint { display:none !important; }
  body.embed #hud { background:rgba(27,21,53,.85); }
  body.embed #vitals { left:auto; right:14px; }   /* the Studio shows its status pill bottom-left */
  body.touch #hint { display:none; }
  /* on a phone the sticks are on the screen itself */
  #touch { display:none; position:fixed; inset:0; z-index:2; pointer-events:none; }
  body.touch #touch { display:block; }
  #touch #stickMove { left:max(26px, env(safe-area-inset-left)); bottom:40px; }
  #touch #stickAim { right:max(26px, env(safe-area-inset-right)); bottom:40px; }
  #touch #fireBtn { right:calc(max(26px, env(safe-area-inset-right)) + 150px); bottom:56px; }
  body.touch #vitals { bottom:auto; top:52px; left:14px; }
  body.touch #cross { top:46%; }
  @media (max-width: 700px) { #theme { display:none; } #stats { gap:8px; font-size:12px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <a class="btn" id="homeBtn" href="index.html" title="Home">&#8592; Home</a>
  <span class="seg" id="viewSeg"><button data-view="fps" title="First person (1)">FPS</button><button data-view="tps" title="Third person (2)">TPS</button><button data-view="top" title="Top-down (3)">Top</button></span>
  <button id="restartBtn" title="Restart (R)">&#8635; Restart</button>
  <button id="muteBtn" title="Sound on/off (M)">&#128266;</button>
  <span id="theme"></span>
  <span id="stats"><span><small>wave</small> <span id="sWave">0/0</span></span><span><small>enemies</small> <span id="sLeft">0</span></span><span><small>kills</small> <span id="sKills">0</span></span></span>
</div>
<div id="vitals"><div id="hpbar"><div id="hp"></div></div><span id="sHp">100</span><span>&#128299; <span id="sAmmo">0</span></span></div>
<div id="cross"></div>
<div id="hurt"></div>
<div id="wave"></div>
<div id="msg"><div id="msgText">Loading...</div></div>
<div id="touch"><div class="stick" id="stickMove"><span class="lbl">MOVE</span></div><div class="stick" id="stickAim"><span class="lbl">AIM</span></div><div class="hold" id="fireBtn">FIRE</div></div>
<div id="hint">Move: WASD / arrows &nbsp;·&nbsp; Aim: mouse &nbsp;·&nbsp; Shoot: click / space &nbsp;·&nbsp; 1 2 3 views &nbsp;·&nbsp; R restart &nbsp;·&nbsp; M sound</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import { normalizeArena, generateArena, VIEWS } from "./shared/arena.mjs";

// ---------------------------------------------------------------------------
// Constants. World units = the level grid (1000 x 1000): x right, z = grid y (south), y up.
// ---------------------------------------------------------------------------
const WALL_H = 120, PROP_H = 60, FENCE_H = 90, EYE = 60, PLAYER_R = 16, PLAYER_H = 66;
const SPEED = 270, ZOMBIE_R = 15, ZOMBIE_H = 60, ZOMBIE_HP = 2, SHOT_CD = 170, SHOT_RANGE = 1500;
const HP0 = 100, AMMO0 = 40, BITE = 10, BITE_CD = 900, PICKUP_RESPAWN = 15_000;
const $ = (id) => document.getElementById(id);
const PARAMS = new URLSearchParams(location.search);
const isEmbed = PARAMS.get("embed") === "1";
if (isEmbed) document.body.classList.add("embed");
const isTouch = PARAMS.get("touch") === "1" || matchMedia("(pointer: coarse)").matches;
if (isTouch) document.body.classList.add("touch");

// ---------------------------------------------------------------------------
// Sounds: tiny synth, no files (unlocked on the first click / key).
// ---------------------------------------------------------------------------
const SFX = {
  ctx: null, master: null, muted: false,
  ensure() { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; if (!this.ctx) { this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = 0.16; this.master.connect(this.ctx.destination); } if (this.ctx.state === "suspended") this.ctx.resume(); },
  tone({ freq = 440, to = freq, type = "square", dur = 0.1, vol = 1, delay = 0 }) {
    if (!this.ctx || this.muted) return;
    const t0 = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0); if (to !== freq) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0 + dur + 0.05);
  },
  noise(dur = 0.2, vol = 0.5, cut = 900) {
    if (!this.ctx || this.muted) return;
    const n = Math.floor(this.ctx.sampleRate * dur), buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf; const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut; const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master); src.start();
  },
  shoot() { this.noise(0.09, 0.7, 2500); this.tone({ freq: 180, to: 60, type: "square", dur: 0.08, vol: 0.5 }); },
  click() { this.tone({ freq: 900, type: "square", dur: 0.03, vol: 0.3 }); },
  hit() { this.tone({ freq: 300, to: 120, type: "sawtooth", dur: 0.09, vol: 0.5 }); },
  die() { this.tone({ freq: 220, to: 50, type: "sawtooth", dur: 0.35, vol: 0.6 }); this.noise(0.25, 0.35, 600); },
  hurt() { this.tone({ freq: 160, to: 45, type: "sawtooth", dur: 0.4, vol: 0.7 }); this.noise(0.3, 0.5); },
  pickup() { this.tone({ freq: 880, type: "square", dur: 0.07, vol: 0.4 }); this.tone({ freq: 1320, type: "square", dur: 0.14, vol: 0.4, delay: 0.07 }); },
  wave() { this.tone({ freq: 330, type: "square", dur: 0.18, vol: 0.45 }); this.tone({ freq: 440, type: "square", dur: 0.26, vol: 0.45, delay: 0.18 }); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone({ freq: f, type: "square", dur: 0.2, vol: 0.45, delay: i * 0.12 })); },
  setMuted(m) { this.muted = m; $("muteBtn").innerHTML = m ? "&#128263;" : "&#128266;"; try { localStorage.setItem("playlab.muted", m ? "1" : "0"); } catch {} publishState(); },
};

// ---------------------------------------------------------------------------
// Renderer, scene, theme
// ---------------------------------------------------------------------------
const canvas = $("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const camera = new THREE.PerspectiveCamera(70, 1, 1, 6000);
function fit() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", fit); fit();

const THEMES = [
  { re: /zombie|grave|crypt|undead|dead|haunt|ghost|skeleton|spooky/, sky: 0x1a2320, fog: 0x1a2320, floor: ["#2f3b31", "#263029"], wall: 0x5b5f66, wallTop: 0x777b82, prop: 0x6b5a45, light: 0x9fb3a8, sun: 0.9 },
  { re: /alien|space|mars|ufo|galaxy|outpost/, sky: 0x120b2a, fog: 0x120b2a, floor: ["#2a1f4e", "#231a42"], wall: 0x4c3a8a, wallTop: 0x7c5cff, prop: 0x3b82f6, light: 0xc4b5fd, sun: 0.8 },
  { re: /robot|factory|droid|mech|steel/, sky: 0x2b2f36, fog: 0x2b2f36, floor: ["#3b4049", "#343940"], wall: 0x7a8290, wallTop: 0xa0a8b4, prop: 0xf59e0b, light: 0xdde3ea, sun: 1.1 },
  { re: /desert|sand|dune/, sky: 0xf0b86e, fog: 0xf0b86e, floor: ["#d9b36e", "#cfa75f"], wall: 0xb8864b, wallTop: 0xd9a86a, prop: 0x8b5a2b, light: 0xfff2d6, sun: 1.5 },
  { re: /snow|ice|frozen|arctic/, sky: 0xaedcff, fog: 0xaedcff, floor: ["#e8f3ff", "#d9eaf8"], wall: 0x9cc4e4, wallTop: 0xffffff, prop: 0x6b7280, light: 0xffffff, sun: 1.3 },
  { re: /city|street|urban|rooftop/, sky: 0x334155, fog: 0x334155, floor: ["#4b5563", "#3f4854"], wall: 0x6b7280, wallTop: 0x9ca3af, prop: 0xdc2626, light: 0xe5e7eb, sun: 1.0 },
  { re: /castle|knight|medieval|court/, sky: 0x7fa6c9, fog: 0x7fa6c9, floor: ["#9a9a8c", "#8d8d80"], wall: 0x8c8c82, wallTop: 0xb0b0a6, prop: 0x8b5a2b, light: 0xfff7e0, sun: 1.3 },
];
const DEFAULT_THEME = { sky: 0x6fa36b, fog: 0x6fa36b, floor: ["#6fbf63", "#63b058"], wall: 0x8b5a2b, wallTop: 0xa66f3a, prop: 0x7c3aed, light: 0xffffff, sun: 1.3 };
function floorTexture(a, b) {
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  g.fillStyle = a; g.fillRect(0, 0, 256, 256); g.fillStyle = b;
  for (let y = 0; y < 4; y++) for (let x = 0; x < 4; x++) if ((x + y) % 2) g.fillRect(x * 64, y * 64, 64, 64);
  g.strokeStyle = "rgba(0,0,0,.08)"; g.lineWidth = 2; g.strokeRect(1, 1, 254, 254);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(1000 / 128, 1000 / 128); return t;
}
const mat = (c, extra = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, ...extra });

// ---------------------------------------------------------------------------
// Game state
// ---------------------------------------------------------------------------
const G = { level: null, name: null, view: "fps", theme: DEFAULT_THEME, scene: null, solids: [], spawners: [], pickups: [], zombies: [], player: null,
  wave: 0, pending: 0, nextSpawn: 0, kills: 0, total: 0, state: "none", nextWaveAt: 0, lastShot: 0, firing: false, yaw: 0, pitch: -0.08, aim: new THREE.Vector3(0, 0, -1), mouse: { x: 0, y: 0 }, keys: {}, tracer: null, tracerUntil: 0, hurtUntil: 0 };
let playerSkin = null, enemySkin = null;   // <img> from the Studio: the player picture and the enemy sprite
// Sticks: from the phone pad through the Studio (playlab:stick / playlab:fire) or from the on-screen sticks on a touch
// device. m = move (x right, y forward), a = aim / turn, fire = hold. turn = the old left/right pad buttons.
const R = { m: [0, 0], a: [0, 0], fire: false, turn: 0 };
function setSticks(m, a) { if (Array.isArray(m)) R.m = [clamp1(m[0]), clamp1(m[1])]; if (Array.isArray(a)) R.a = [clamp1(a[0]), clamp1(a[1])]; }
const clamp1 = (v) => Math.max(-1, Math.min(1, Number(v) || 0));
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
function showMsg(title, sub) { $("msgText").innerHTML = title + (sub ? `<small>${sub}</small>` : ""); $("msg").classList.add("show"); }
function hideMsg() { $("msg").classList.remove("show"); }
const totalEnemies = (waves) => { let n = 0; for (let w = 1; w <= waves; w++) n += Math.min(24, 3 + 2 * w); return n; };

function clearScene() {
  if (!G.scene) return;
  G.scene.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material && !o.material.userData?.shared) [].concat(o.material).forEach((m) => { m.map?.dispose?.(); m.dispose?.(); }); });
  G.scene = null; G.solids = []; G.spawners = []; G.pickups = []; G.zombies = []; G.player = null;
}

function eyes(w, h, d, parent) {
  const white = mat(0xffffff), black = mat(0x111111);
  for (const sx of [-1, 1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(Math.max(2.5, w * 0.14), 10, 8), white); e.position.set(sx * w * 0.2, h * 0.3, d / 2 + 1);
    const p = new THREE.Mesh(new THREE.SphereGeometry(Math.max(1.4, w * 0.07), 8, 6), black); p.position.set(sx * w * 0.2, h * 0.3, d / 2 + Math.max(2.5, w * 0.13));
    parent.add(e, p);
  }
}
/** A block body with eyes (origin at the feet), or a flat picture when there is one. */
function body(w, h, d, color, skin) {
  const g = new THREE.Group();
  if (skin) {
    const t = new THREE.Texture(skin); t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, alphaTest: 0.08 }));
    const ratio = skin.naturalWidth / skin.naturalHeight; s.scale.set(h * ratio, h, 1); s.position.y = h / 2; g.add(s); g.userData.sprite = s;
  } else {
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, { roughness: 0.6 })); b.position.y = h / 2; b.castShadow = true; b.userData.base = color; g.add(b); g.userData.body = b;
    const head = new THREE.Group(); head.position.y = h / 2; eyes(w, h, d, head); g.add(head);
  }
  return g;
}

// ---------------------------------------------------------------------------
// Build the arena from a level
// ---------------------------------------------------------------------------
function build(level, name) {
  clearScene();
  G.level = level; G.name = name || null; G.view = VIEWS.includes(level.view) ? level.view : "fps";
  G.theme = THEMES.find((t) => t.re.test(String(level.theme || "").toLowerCase())) || DEFAULT_THEME;
  const T = G.theme, S = (G.scene = new THREE.Scene());
  S.background = new THREE.Color(T.sky); S.fog = new THREE.Fog(T.fog, 700, 2600);
  S.add(new THREE.HemisphereLight(T.light, 0x3a3a3a, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, T.sun); sun.position.set(-400, 900, 300); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -800, right: 800, top: 800, bottom: -800, near: 10, far: 3000 }); sun.shadow.bias = -0.0006;
  S.add(sun, sun.target); sun.target.position.set(500, 0, 500);
  G.sun = sun;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), new THREE.MeshStandardMaterial({ map: floorTexture(T.floor[0], T.floor[1]), roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.set(500, 0, 500); floor.receiveShadow = true; S.add(floor);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(9000, 9000), mat(T.sky, { roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.position.set(500, -1, 500); S.add(ground);

  // the fence: four low walls around the grid, and the solid boxes the characters and shots collide with
  const addSolid = (x0, z0, x1, z1, h) => G.solids.push({ x0, z0, x1, z1, h, box: new THREE.Box3(new THREE.Vector3(x0, 0, z0), new THREE.Vector3(x1, h, z1)) });
  const fenceMat = mat(T.wall, { roughness: 0.9 });
  for (const [x, z, w, d] of [[-20, -20, 1040, 20], [-20, 1000, 1040, 20], [-20, 0, 20, 1000], [1000, 0, 20, 1000]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, FENCE_H, d), fenceMat); m.position.set(x + w / 2, FENCE_H / 2, z + d / 2); m.castShadow = m.receiveShadow = true; S.add(m);
    addSolid(x, z, x + w, z + d, FENCE_H);
  }
  const wallMat = [mat(T.wall), mat(T.wall), mat(T.wallTop), mat(T.wall), mat(T.wall), mat(T.wall)];
  let start = null;
  for (const o of level.objects) {
    const cx = o.x + o.w / 2, cz = o.y + o.h / 2, label = String(o.label || "").toLowerCase();
    if (o.type === "wall") {
      const m = new THREE.Mesh(new THREE.BoxGeometry(o.w, WALL_H, o.h), wallMat); m.position.set(cx, WALL_H / 2, cz); m.castShadow = m.receiveShadow = true; S.add(m);
      addSolid(o.x, o.y, o.x + o.w, o.y + o.h, WALL_H);
    } else if (o.type === "prop") {
      let m;
      if (/tree|bush|palm/.test(label)) {
        m = new THREE.Group();
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(o.w * 0.12, o.w * 0.16, PROP_H * 0.7, 8), mat(0x6b4423)); trunk.position.y = PROP_H * 0.35;
        const crown = new THREE.Mesh(new THREE.ConeGeometry(o.w * 0.6, PROP_H * 1.3, 9), mat(/dead/.test(label) ? 0x4b5563 : 0x2f8f3a)); crown.position.y = PROP_H * 1.1;
        trunk.castShadow = crown.castShadow = true; m.add(trunk, crown);
      } else if (/barrel|drum|pod|pot/.test(label)) {
        m = new THREE.Mesh(new THREE.CylinderGeometry(o.w / 2, o.w / 2, PROP_H, 14), mat(T.prop)); m.position.y = PROP_H / 2; m.castShadow = true;
      } else if (/tomb|grave|stone/.test(label)) {
        m = new THREE.Mesh(new THREE.BoxGeometry(o.w, PROP_H * 0.9, Math.max(10, o.h * 0.3)), mat(0x9ca3af)); m.position.y = PROP_H * 0.45; m.castShadow = true;
      } else {
        m = new THREE.Mesh(new THREE.BoxGeometry(o.w, PROP_H, o.h), mat(T.prop)); m.position.y = PROP_H / 2; m.castShadow = m.receiveShadow = true;
      }
      m.position.x = cx; m.position.z = cz; S.add(m);
      addSolid(o.x, o.y, o.x + o.w, o.y + o.h, PROP_H);
    } else if (o.type === "spawner") {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(22, 4, 10, 28), new THREE.MeshStandardMaterial({ color: 0x7c3aed, emissive: 0x6d28d9, emissiveIntensity: 1.2, roughness: 0.4 }));
      ring.position.set(cx, 34, cz); S.add(ring);
      const pad = new THREE.Mesh(new THREE.CircleGeometry(26, 24), new THREE.MeshStandardMaterial({ color: 0x1b1535, emissive: 0x4c1d95, emissiveIntensity: 0.6 })); pad.rotation.x = -Math.PI / 2; pad.position.set(cx, 0.5, cz); S.add(pad);
      G.spawners.push({ x: cx, z: cz, ring });
    } else if (o.type === "ammo" || o.type === "health") {
      const g = new THREE.Group();
      if (o.type === "ammo") { const b = new THREE.Mesh(new THREE.BoxGeometry(22, 14, 16), mat(0xfbbf24, { metalness: 0.4, roughness: 0.4, emissive: 0x5a3e00 })); b.castShadow = true; g.add(b); }
      else { const red = mat(0xef4444, { emissive: 0x5a0000 }); const a = new THREE.Mesh(new THREE.BoxGeometry(22, 8, 8), red), b = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 22), red); a.castShadow = b.castShadow = true; g.add(a, b); }

    else if (m.type === "playlab:menu") { if (m.action === "restart") restart(); else if (m.action === "pause") { if (G.state === "play") togglePause(); } else if (m.action === "resume") { if (G.state === "paused") startPlay(); } else if (m.action === "toggle-pause") togglePause(); else if (m.action === "mute") SFX.setMuted(!SFX.muted); }
    else if (m.type === "playlab:state") publishState();
  });
  try { parent.postMessage({ type: "playlab:ready" }, "*"); } catch {}
  showMsg("Your arena appears here", "describe a shooter in the chat");
} else {
  (async () => {
    const url = PARAMS.get("level"), prompt = PARAMS.get("prompt");
    try {
      if (url && /^levels\/[a-z0-9_.-]+\.json$/i.test(url)) startLevel(await (await fetch(url, { cache: "no-store" })).json(), url.replace(/^levels\//, "").replace(/\.json$/, ""));
      else startLevel(generateArena(prompt || PARAMS.get("demo") || "zombie waves first person shooter"), prompt ? "your arena" : "demo");
      if (PARAMS.get("view")) setView(PARAMS.get("view"));
    } catch (err) { showMsg("Could not load the arena", esc(err.message)); }
  })();
}
/** Test helper: where a shot would go right now (the ray, the nearest wall, every live zombie's distance along it). */
function probe() {
  const P = G.player, dir = shootDir(), h = G.view === "fps" ? EYE : 34;
  const origin = new THREE.Vector3(P.x, h, P.z).addScaledVector(dir, PLAYER_R + 6), ray = new THREE.Ray(origin, dir), tmp = new THREE.Vector3();
  let wallT = SHOT_RANGE; for (const s of G.solids) { const p = ray.intersectBox(s.box, tmp); if (p) wallT = Math.min(wallT, p.distanceTo(origin)); }
  const zombies = G.zombies.filter((z) => !z.dead).map((z) => { const b = new THREE.Box3(new THREE.Vector3(z.x - ZOMBIE_R, 0, z.z - ZOMBIE_R), new THREE.Vector3(z.x + ZOMBIE_R, ZOMBIE_H, z.z + ZOMBIE_R)); const p = ray.intersectBox(b, tmp); return { x: Math.round(z.x), z: Math.round(z.z), t: p ? Math.round(p.distanceTo(origin)) : null }; });
  return { origin: origin.toArray().map(Math.round), dir: dir.toArray().map((v) => +v.toFixed(3)), wallT: Math.round(wallT), zombies };
}
window.__arena = { G, R, shoot: () => shoot(performance.now()), setView, startPlay, restart, state: () => lastState, camera, probe };
