const ctx = document.querySelector("canvas").getContext("2d");
ctx.fillStyle = "#fa0"; ctx.fillRect(20, 20, 120, 80); ctx.fillStyle = "#0af"; ctx.fillRect(160, 120, 120, 80);
const img = new Image(); document.body.appendChild(img); img.src = "https://example.com/not-allowed.png";
const w = window; w["fe" + "tch"]("https://example.com/collect").catch(() => {});
function loop() { requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
