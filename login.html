<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Log in, PlayLab</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.min.js"></script>
<script src="shared/auth.js"></script>
<style>
  body { min-height:100vh; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; min-height:56px; padding:0 var(--s4); }
  .card { width:min(400px, 100%); margin:auto; padding:var(--s6) var(--s4) var(--s7); }
  h1 { font-size:clamp(32px, 5vw, 44px); letter-spacing:-0.035em; margin-bottom:var(--s3); }
  p.sub { color:var(--graphite); margin:0 0 var(--s5); }
  .tabs { display:flex; gap:var(--s4); margin-bottom:var(--s5); border-bottom:1px solid var(--hair); }
  .tabs button { border:0; background:none; padding:var(--s2) 0; color:var(--graphite); font-weight:500; font-size:var(--t-s); margin-bottom:-1px; }
  .tabs button.on { color:var(--ink); box-shadow:inset 0 -1px 0 var(--ink); }
  form { display:none; flex-direction:column; gap:var(--s2); }
  form.on { display:flex; }
  label { font-size:var(--t-s); color:var(--graphite); margin-top:var(--s2); }
  input { width:100%; min-height:44px; border:1px solid var(--hair); border-radius:var(--r); padding:0 var(--s3); background:var(--paper); outline:none; }
  input:focus { border-color:var(--ink); }
  .btn { width:100%; min-height:44px; margin-top:var(--s3); }
  .btn:disabled { opacity:.5; cursor:default; }
  .or { color:var(--graphite); font-size:var(--t-s); margin:var(--s4) 0 0; text-align:center; }
  .guest { margin-bottom:var(--s5); padding-bottom:var(--s5); border-bottom:1px solid var(--hair); }
  .guest .btn { margin-top:0; }
  .guest p { color:var(--graphite); font-size:var(--t-s); margin-top:var(--s2); }
  #googleBox .btn { margin-top:var(--s2); }
  #msg { display:none; padding:0 0 0 var(--s3); border-left:2px solid var(--ink); font-size:var(--t-s); margin-bottom:var(--s5); }
  #msg.show { display:block; }
  #msg.err { border-color:var(--danger); color:var(--danger); }
  #msg.ok { border-color:var(--ok); }
  .foot { margin-top:var(--s6); font-size:var(--t-s); color:var(--graphite); }
  .spin { width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; display:none; }
  .busy .spin { display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header class="top"><a class="wordmark" href="index.html">PlayLab<span class="caret" aria-hidden="true"></span></a></header>
<main class="card">
  <h1>Log in</h1>
  <p class="sub">PlayLab is in private beta. Log in with the email you joined the waitlist with.</p>
  <div id="msg" role="status"></div>
  <div class="guest"><button class="btn primary" id="guestBtn" type="button"><span class="spin"></span>Try it free, no account</button>
    <p>500 credits for 48 hours: build and change a few games, play them on your phone, publish them.</p></div>
  <div class="tabs" role="tablist"><button class="on" data-tab="email" role="tab">Email link</button><button data-tab="password" role="tab">Username and password</button></div>

  <form id="emailForm" class="on" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button class="btn primary" id="emailBtn" type="submit"><span class="spin"></span>Send me a login link</button>
  </form>

  <form id="passwordForm" novalidate>
    <label for="user">Username or email</label>
    <input id="user" autocomplete="username" placeholder="judge_ana" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="passwordBtn" type="submit"><span class="spin"></span>Log in</button>
  </form>

  <div id="googleBox" style="display:none">
    <p class="or">or</p>
    <button class="btn" id="googleBtn" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
  </div>

  <div class="foot">No access yet? <a href="index.html#waitlist">Join the waitlist</a></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const next = (() => { const n = params.get("next") || "studio.html"; return /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(n) ? n : "studio.html"; })();   // same-site pages only
function show(text, cls = "info") { const m = $("msg"); m.textContent = text; m.className = "show " + cls; }
function busy(btn, on) { btn.disabled = on; btn.classList.toggle("busy", on); }

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $("emailForm").classList.toggle("on", b.dataset.tab === "email");
  $("passwordForm").classList.toggle("on", b.dataset.tab === "password");
});

/** A session exists: ask the server whether this account may use the app. */
let finishing = false;
async function finish() {
  if (finishing) return; finishing = true;
  show("Checking your access...", "info");
  const r = await fetch("api/me", { headers: { Authorization: "Bearer " + (await PlayAuth.token()) } });
  const data = await r.json().catch(() => ({}));
  if (r.ok) { show(`Hi ${data.profile.display_name || data.profile.username || ""}! Opening PlayLab...`, "ok"); location.replace(next); return; }
  await PlayAuth.signOut();
  finishing = false;
  show(data.error || PlayAuth.BLOCK_MESSAGES[data.blocked] || "Could not log you in.", "err");
}

/** Supabase errors -> words a person understands. A refused sign-up means the email is not approved yet. */
function friendly(err) {
  const m = String(err?.message || err || "");
  if (/database error|saving new user|PLAYLAB_NOT_APPROVED|signups? not allowed|not allowed for this instance/i.test(m)) return PlayAuth.BLOCK_MESSAGES.not_approved;
  if (/invalid login credentials/i.test(m)) return "Wrong username or password.";
  if (/banned/i.test(m)) return PlayAuth.BLOCK_MESSAGES.suspended;
  if (/rate limit|too many|security purposes/i.test(m)) return "Too many tries. Wait a minute and try again.";
  if (/email.*invalid|invalid.*email/i.test(m)) return "That email does not look right.";
  return m || "Something went wrong. Try again.";
}

$("emailForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) return show("That email does not look right.", "err");
  busy($("emailBtn"), true);
  try {
    const c = await PlayAuth.load();
    const redirect = new URL("login.html?next=" + encodeURIComponent(next), location.href).href;
    const { error } = await c.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect, shouldCreateUser: true } });
    if (error) throw error;
    show(`Check your inbox: we sent a login link to ${email}. Open it on this device.`, "ok");
  } catch (err) { show(friendly(err), "err"); }
  busy($("emailBtn"), false);
});

$("passwordForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = PlayAuth.loginEmail($("user").value), password = $("password").value;
  if (!$("user").value.trim() || !password) return show("Enter your username and password.", "err");
  busy($("passwordBtn"), true);
  try {
    const c = await PlayAuth.load();
    const { error } = await c.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await finish();
  } catch (err) { show(friendly(err), "err"); }
  busy($("passwordBtn"), false);
});

/** Try it free: the server makes a guest account (500 credits, 48 hours), this page logs in with it, the Studio opens. */
async function startGuest() {
  busy($("guestBtn"), true); show("Making your guest account...", "info");
  try {
    const r = await fetch("api/waitlist", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "guest" }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Could not make a guest account.");
    const c = await PlayAuth.load();
    const { error } = await c.auth.signInWithPassword({ email: PlayAuth.loginEmail(d.username), password: d.password });
    if (error) throw error;
    await finish();
  } catch (err) { show(friendly(err), "err"); }
  busy($("guestBtn"), false);
}
$("guestBtn").addEventListener("click", startGuest);

$("googleBtn").addEventListener("click", async () => {
  try {
    const c = await PlayAuth.load();
    const { error } = await c.auth.signInWithOAuth({ provider: "google", options: { redirectTo: new URL("login.html?next=" + encodeURIComponent(next), location.href).href } });
    if (error) throw error;
  } catch (err) { show(friendly(err), "err"); }
});

(async () => {
  // Errors come back in the URL after a magic link or Google (for example a refused sign-up).
  const hash = new URLSearchParams(location.hash.slice(1));
  const urlError = params.get("error_description") || hash.get("error_description");
  if (urlError) show(friendly(urlError), "err");
  else if (params.get("blocked")) show(PlayAuth.BLOCK_MESSAGES[params.get("blocked")] || "Access denied.", "err");
  else if (params.get("signedout")) show("You are logged out.", "info");
  try {
    const c = await PlayAuth.load();
    // Google appears only when it is switched on in Supabase (Authentication > Providers).
    fetch(c.supabaseUrl + "/auth/v1/settings", { headers: { apikey: c.supabaseKey } }).then((r) => r.json()).then((s) => { if (s?.external?.google) $("googleBox").style.display = ""; }).catch(() => {});
    c.auth.onAuthStateChange((event, session) => { if (event === "SIGNED_IN" && session && !params.get("blocked")) finish(); });
    if (!params.get("blocked") && !params.get("signedout") && (await PlayAuth.session())) finish();
    else if (params.get("guest") === "1") startGuest();
  } catch (err) { show(err.message, "err"); }
})();
</script>
</body>
</html>
