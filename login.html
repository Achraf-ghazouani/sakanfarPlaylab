<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbfaff">
<title>Log in · Sakanfar PlayLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.min.js"></script>
<script src="shared/auth.js"></script>
<style>
  :root { --bg:#fbfaff; --lav:#efeaff; --lav-2:#e2d9ff; --purple:#7c3aed; --purple-deep:#5b21b6; --ink:#1b1535; --muted:#6b6480; --line:#ebe6f7; --red:#b91c1c; --green:#15803d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:radial-gradient(1200px 600px at 20% -10%, #efe7ff 0, transparent 60%), radial-gradient(900px 500px at 110% 110%, #f3edff 0, transparent 60%), var(--bg); color:var(--ink); font-family:Inter, system-ui, sans-serif; display:flex; align-items:center; justify-content:center; padding:20px 16px; }
  .card { width:min(420px, 100%); background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 20px 50px rgba(91,33,182,.10); padding:26px 24px; animation:rise .35s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(12px); } }
  .brand { display:flex; align-items:center; gap:10px; font-family:Fredoka, system-ui, sans-serif; font-weight:700; font-size:20px; color:var(--purple-deep); text-decoration:none; margin-bottom:18px; }
  .brand .logo { width:32px; height:32px; border-radius:10px; background:linear-gradient(135deg, var(--purple), #c084fc); display:grid; place-items:center; }
  h1 { font-family:Fredoka, system-ui, sans-serif; font-size:26px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 18px; font-size:14px; }
  .tabs { display:flex; background:var(--lav); border-radius:12px; padding:4px; margin-bottom:16px; }
  .tabs button { flex:1; border:0; background:transparent; border-radius:9px; padding:9px; font:600 14px Inter, sans-serif; color:var(--muted); cursor:pointer; }
  .tabs button.on { background:#fff; color:var(--purple-deep); box-shadow:0 2px 8px rgba(91,33,182,.10); }
  form { display:none; flex-direction:column; gap:10px; }
  form.on { display:flex; }
  label { font-size:13px; font-weight:600; color:var(--ink); }
  input { width:100%; font:15px Inter, sans-serif; border:1px solid var(--lav-2); border-radius:12px; padding:11px 13px; outline:none; background:#fff; color:var(--ink); }
  input:focus { border-color:var(--purple); box-shadow:0 0 0 3px rgba(124,58,237,.12); }
  .btn { border:0; border-radius:12px; padding:12px 14px; font:700 15px Inter, sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:9px; width:100%; }
  .btn.primary { background:var(--purple); color:#fff; }
  .btn.primary:hover { background:var(--purple-deep); }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--lav-2); }
  .btn.ghost:hover { background:var(--lav); }
  .btn:disabled { opacity:.6; cursor:default; }
  .or { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; margin:16px 0; }
  .or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
  #msg { display:none; border-radius:12px; padding:11px 13px; font-size:14px; margin-bottom:14px; line-height:1.45; }
  #msg.show { display:block; }
  #msg.err { background:#fef2f2; color:var(--red); border:1px solid #fecaca; }
  #msg.ok { background:#f0fdf4; color:var(--green); border:1px solid #bbf7d0; }
  #msg.info { background:var(--lav); color:var(--purple-deep); border:1px solid var(--lav-2); }
  .foot { margin-top:18px; font-size:13px; color:var(--muted); text-align:center; }
  .foot a { color:var(--purple-deep); font-weight:600; }
  .spin { width:15px; height:15px; border:2px solid rgba(255,255,255,.5); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; display:none; }
  .busy .spin { display:inline-block; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="index.html"><span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1 10-10-3-3L5 16l-1 4z"/><path d="M13 7l3 3"/></svg></span>Sakanfar PlayLab</a>
  <h1>Welcome back</h1>
  <p class="sub">PlayLab is in private beta. Log in with the email you joined the waitlist with.</p>
  <div id="msg" role="status"></div>
  <div class="tabs" role="tablist"><button class="on" data-tab="email" role="tab">Email link</button><button data-tab="password" role="tab">Username</button></div>

  <form id="emailForm" class="on" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
    <button class="btn primary" id="emailBtn" type="submit"><span class="spin"></span>Send me a login link</button>
  </form>

  <form id="passwordForm" novalidate>
    <label for="user">Username or email</label>
    <input id="user" autocomplete="username" placeholder="judge_ana" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="passwordBtn" type="submit"><span class="spin"></span>Log in</button>
  </form>

  <div id="googleBox" style="display:none">
    <div class="or">or</div>
    <button class="btn ghost" id="googleBtn" type="button"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>Continue with Google</button>
  </div>

  <div class="foot">No access yet? <a href="index.html#waitlist">Join the waitlist</a></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const next = (() => { const n = params.get("next") || "studio.html"; return /^[a-z0-9_-]+\.html(\?[^#]*)?$/i.test(n) ? n : "studio.html"; })();   // same-site pages only
function show(text, cls = "info") { const m = $("msg"); m.textContent = text; m.className = "show " + cls; }
function busy(btn, on) { btn.disabled = on; btn.classList.toggle("busy", on); }

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $("emailForm").classList.toggle("on", b.dataset.tab === "email");
  $("passwordForm").classList.toggle("on", b.dataset.tab === "password");
});

/** A session exists: ask the server whether this account may use the app. */
let finishing = false;
async function finish() {
  if (finishing) return; finishing = true;
  show("Checking your access...", "info");
  const r = await fetch("api/me", { headers: { Authorization: "Bearer " + (await PlayAuth.token()) } });
  const data = await r.json().catch(() => ({}));
  if (r.ok) { show(`Hi ${data.profile.display_name || data.profile.username || ""}! Opening PlayLab...`, "ok"); location.replace(next); return; }
  await PlayAuth.signOut();
  finishing = false;
  show(data.error || PlayAuth.BLOCK_MESSAGES[data.blocked] || "Could not log you in.", "err");
}

/** Supabase errors -> words a person understands. A refused sign-up means the email is not approved yet. */
function friendly(err) {
  const m = String(err?.message || err || "");
  if (/database error|saving new user|PLAYLAB_NOT_APPROVED|signups? not allowed|not allowed for this instance/i.test(m)) return PlayAuth.BLOCK_MESSAGES.not_approved;
  if (/invalid login credentials/i.test(m)) return "Wrong username or password.";
  if (/banned/i.test(m)) return PlayAuth.BLOCK_MESSAGES.suspended;
  if (/rate limit|too many|security purposes/i.test(m)) return "Too many tries. Wait a minute and try again.";
  if (/email.*invalid|invalid.*email/i.test(m)) return "That email does not look right.";
  return m || "Something went wrong. Try again.";
}

$("emailForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("email").value.trim().toLowerCase();
  if (!/^\S+@\S+\.\S+$/.test(email)) return show("That email does not look right.", "err");
  busy($("emailBtn"), true);
  try {
    const c = await PlayAuth.load();
    const redirect = new URL("login.html?next=" + encodeURIComponent(next), location.href).href;
    const { error } = await c.auth.signInWithOtp({ email, options: { emailRedirectTo: redirect, shouldCreateUser: true } });
    if (error) throw error;
    show(`Check your inbox: we sent a login link to ${email}. Open it on this device.`, "ok");
  } catch (err) { show(friendly(err), "err"); }
  busy($("emailBtn"), false);
});

$("passwordForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = PlayAuth.loginEmail($("user").value), password = $("password").value;
  if (!$("user").value.trim() || !password) return show("Enter your username and password.", "err");
  busy($("passwordBtn"), true);
  try {
    const c = await PlayAuth.load();
    const { error } = await c.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await finish();
  } catch (err) { show(friendly(err), "err"); }
  busy($("passwordBtn"), false);
});

$("googleBtn").addEventListener("click", async () => {
  try {
    const c = await PlayAuth.load();
    const { error } = await c.auth.signInWithOAuth({ provider: "google", options: { redirectTo: new URL("login.html?next=" + encodeURIComponent(next), location.href).href } });
    if (error) throw error;
  } catch (err) { show(friendly(err), "err"); }
});

(async () => {
  // Errors come back in the URL after a magic link or Google (for example a refused sign-up).
  const hash = new URLSearchParams(location.hash.slice(1));
  const urlError = params.get("error_description") || hash.get("error_description");
  if (urlError) show(friendly(urlError), "err");
  else if (params.get("blocked")) show(PlayAuth.BLOCK_MESSAGES[params.get("blocked")] || "Access denied.", "err");
  else if (params.get("signedout")) show("You are logged out.", "info");
  try {
    const c = await PlayAuth.load();
    // Google appears only when it is switched on in Supabase (Authentication > Providers).
    fetch(c.supabaseUrl + "/auth/v1/settings", { headers: { apikey: c.supabaseKey } }).then((r) => r.json()).then((s) => { if (s?.external?.google) $("googleBox").style.display = ""; }).catch(() => {});
    c.auth.onAuthStateChange((event, session) => { if (event === "SIGNED_IN" && session && !params.get("blocked")) finish(); });
    if (!params.get("blocked") && !params.get("signedout") && (await PlayAuth.session())) finish();
  } catch (err) { show(err.message, "err"); }
})();
</script>
</body>
</html>
