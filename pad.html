<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbfaff">
<title>PlayLab Pad</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/ui.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.80.0/dist/umd/supabase.min.js"></script>
<script src="shared/joystick.js"></script>
<script src="shared/phonelink.js"></script>
<script src="shared/paper.js"></script>
<style>
  :root { --bg:#ffffff; --lav:#f4f4f5; --lav-2:#e4e4e7; --purple:#2b3bff; --purple-deep:#000000; --ink:#000000; --muted:#6b6b70; --player:#22c55e; --green:#0a7d3c; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:system-ui, -apple-system, "Segoe UI", sans-serif; touch-action:none; overscroll-behavior:none; -webkit-user-select:none; user-select:none; }
  body { background-image: radial-gradient(600px 300px at 0% 0%, #ebe3ff 0%, transparent 65%), radial-gradient(500px 300px at 100% 100%, #ffe6f4 0%, transparent 60%); }
  .top { position:fixed; top:0; left:0; right:0; height:48px; display:flex; align-items:center; gap:8px; padding:0 max(10px, env(safe-area-inset-right)) 0 max(10px, env(safe-area-inset-left)); z-index:3; }
  .brand { font-family:"Fredoka", system-ui, sans-serif; font-weight:700; font-size:16px; color:var(--purple-deep); white-space:nowrap; }
  .pill { display:inline-flex; align-items:center; gap:7px; background:#fff; border:2px solid var(--lav-2); border-radius:999px; padding:5px 10px; font-size:12px; font-weight:600; color:var(--purple-deep); white-space:nowrap; }
  .pill .dot { width:9px; height:9px; border-radius:50%; background:#f59e0b; }
  .pill.connected .dot { background:#22c55e; }
  .pill.reconnecting .dot, .pill.connecting .dot { background:#f59e0b; animation:blink 1s infinite; }
  .pill.error .dot { background:#ef4444; }
  @keyframes blink { 50% { opacity:.3; } }
  .player { background:var(--player); color:#fff; border-color:transparent; }
  .player i { width:12px; height:12px; border-radius:3px; background:#fff; opacity:.9; display:inline-block; }
  .spacer { flex:1; }
  button.small { border:2px solid var(--lav-2); background:#fff; border-radius:999px; padding:6px 12px; font-size:13px; font-weight:700; color:var(--purple-deep); white-space:nowrap; }
  button.small.primary { background:var(--purple); color:#fff; border-color:var(--purple); }
  button.small.go { background:var(--green); color:#fff; border-color:var(--green); font-family:"Fredoka", system-ui, sans-serif; font-size:15px; padding:6px 16px; }

  .mode { display:none; }
  body.mode-pad #pad, body.mode-cam #cam { display:block; }

  /* controller */
  #pad { position:fixed; inset:48px 0 0 0; }
  #stickMove, #stickAim, #fire { display:none; }
  body.layout-arena #left, body.layout-arena #right, body.layout-arena #jump { display:none !important; }
  body.layout-arena #stickMove, body.layout-arena #stickAim, body.layout-arena #fire { display:block; }
  body.layout-arena #fire { display:flex; }
  /* generated games (PlayLab.controller): a 4-way d-pad, a stick, steering, A and B, a tap pad; .code hides the engines' own pad */
  #dpad, #btnA, #btnB, #tapPad { display:none; }
  body.code #left, body.code #right, body.code #jump, body.code #stickMove, body.code #stickAim, body.code #fire { display:none !important; }
  body.code.pad-dpad #dpad { display:block; }
  body.code.pad-stick #stickMove, body.code.pad-twin #stickMove, body.code.pad-twin #stickAim { display:block !important; }
  body.code.pad-twin #fire { display:flex !important; }
  body.code.pad-steer #left, body.code.pad-steer #right { display:flex !important; }
  body.code.has-a #btnA, body.code.has-b #btnB { display:flex; }
  body.code.pad-tap #tapPad { display:block; }
  body.code.pad-tap #hint { display:none; }
  #dpad { position:absolute; left:max(16px, env(safe-area-inset-left)); bottom:max(14px, env(safe-area-inset-bottom)); width:min(52vh, 230px); height:min(52vh, 230px); }
  #dpad .btn { position:absolute; width:34%; height:34%; border-radius:16px; font-size:22px; }
  #dUp { left:33%; top:0; bottom:auto; } #dDown { left:33%; bottom:0; } #dLeft { left:0; top:33%; bottom:auto; } #dRight { right:0; top:33%; bottom:auto; }
  #btnA { right:max(18px, env(safe-area-inset-right)); width:min(32vh, 140px); height:min(32vh, 140px); font-size:20px; font-family:"Fredoka", system-ui, sans-serif; font-weight:700; border-color:var(--player); color:var(--player); }
  #btnA.pressed { background:var(--player); color:#fff; }
  #btnB { right:calc(max(18px, env(safe-area-inset-right)) + min(32vh, 140px) + 14px); bottom:calc(max(18px, env(safe-area-inset-bottom)) + 26px); width:min(24vh, 104px); height:min(24vh, 104px); font-size:17px; font-family:"Fredoka", system-ui, sans-serif; font-weight:700; }
  body.code.has-b:not(.has-a) #btnB { right:max(18px, env(safe-area-inset-right)); bottom:max(18px, env(safe-area-inset-bottom)); width:min(32vh, 140px); height:min(32vh, 140px); }
  #tapPad { position:absolute; left:max(14px, env(safe-area-inset-left)); right:max(14px, env(safe-area-inset-right)); top:56px; bottom:max(14px, env(safe-area-inset-bottom)); border:3px dashed var(--lav-2); border-radius:22px; background:rgba(255,255,255,.55); touch-action:none; }
  #tapPad span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-weight:700; pointer-events:none; }
  #tapPad i { position:absolute; width:46px; height:46px; margin:-23px 0 0 -23px; border-radius:50%; background:var(--player); opacity:.55; pointer-events:none; animation:tapfade .45s ease-out forwards; }
  @keyframes tapfade { to { transform:scale(1.8); opacity:0; } }
  /* the pad is light: purple sticks and dark labels */
  #pad .stick { background:rgba(124,58,237,.10); border-color:rgba(124,58,237,.45); }
  #pad .stick.on { background:rgba(124,58,237,.18); }
  #pad .stick .jk { background:#8b5cf6; box-shadow:0 3px 10px rgba(91,33,182,.35); }
  #pad .stick .lbl { color:#6b6480; font-weight:700; }
  #pad .hold { border-color:#fff; box-shadow:0 4px 14px rgba(239,68,68,.35); }
  #stickMove { left:max(26px, env(safe-area-inset-left)); bottom:46px; }
  #stickAim { right:max(26px, env(safe-area-inset-right)); bottom:46px; }
  #fire { right:calc(max(26px, env(safe-area-inset-right)) + 150px); bottom:62px; }
  .btn { position:absolute; bottom:max(18px, env(safe-area-inset-bottom)); width:min(26vh, 120px); height:min(26vh, 120px); border-radius:50%; background:#fff; border:3px solid var(--lav-2); box-shadow:0 10px 24px rgba(91,33,182,.15); display:flex; align-items:center; justify-content:center; font-size:40px; color:var(--purple-deep); touch-action:none; transition:transform .05s, background .05s; }
  .btn.pressed { background:var(--purple); color:#fff; transform:scale(.94); border-color:var(--purple); }
  /* the game's UI kit: the uploaded button on every pad button, its colour on the sticks and pills */
  body.kit .btn, body.kit #fire { background-image:var(--pad-btn); background-size:100% 100%; background-color:transparent; border-radius:18px; border-color:transparent; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  body.kit .btn.pressed, body.kit #fire.pressed { filter:brightness(.8); transform:scale(.94); }
  #left { left:max(18px, env(safe-area-inset-left)); }
  #right { left:calc(max(18px, env(safe-area-inset-left)) + min(26vh, 120px) + 16px); }
  #jump { right:max(18px, env(safe-area-inset-right)); width:min(34vh, 150px); height:min(34vh, 150px); font-size:22px; font-family:"Fredoka", system-ui, sans-serif; font-weight:700; letter-spacing:.04em; border-color:var(--player); color:var(--player); }
  #jump.pressed { background:var(--player); color:#fff; }
  .hint { position:absolute; left:50%; top:38%; transform:translate(-50%, -50%); text-align:center; color:var(--muted); font-size:14px; max-width:60vw; }
  .hint b { display:block; font-family:"Fredoka", system-ui, sans-serif; font-size:22px; color:var(--ink); margin-bottom:4px; }
  .menu { position:absolute; top:10px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:center; max-width:96vw; }
  .menu button { border:2px solid var(--lav-2); background:#fff; border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700; color:var(--purple-deep); white-space:nowrap; touch-action:manipulation; }
  .menu button.on { background:var(--purple); color:#fff; border-color:var(--purple); }
  #gameState { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40vw; }

  /* camera */
  #cam { position:fixed; inset:48px 0 0 0; background:#1b1535; }
  #camCanvas { width:100%; height:100%; object-fit:contain; display:block; background:#1b1535; }
  #camStatus { position:absolute; left:50%; bottom:max(14px, env(safe-area-inset-bottom)); transform:translateX(-50%); background:rgba(255,255,255,.92); color:var(--purple-deep); font-weight:700; font-size:14px; padding:8px 14px; border-radius:999px; white-space:nowrap; max-width:92vw; overflow:hidden; text-overflow:ellipsis; transition:background .2s; }
  #camStatus.error { color:#b91c1c; white-space:normal; text-align:center; border-radius:14px; }
  #camStatus.busy::before { content:""; display:inline-block; width:10px; height:10px; border:2px solid #ddd6fe; border-top-color:var(--purple); border-radius:50%; margin-right:8px; vertical-align:-1px; animation:spin .8s linear infinite; }
  #camStatus.live::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:#22c55e; margin-right:7px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #captureBtn { position:absolute; right:max(14px, env(safe-area-inset-right)); bottom:max(14px, env(safe-area-inset-bottom)); width:64px; height:64px; border-radius:50%; background:#fff; border:4px solid var(--lav-2); box-shadow:0 8px 20px rgba(0,0,0,.35); }
  #captureBtn::after { content:""; position:absolute; inset:8px; border-radius:50%; background:var(--purple); }
  #captureBtn:active::after { background:var(--purple-deep); }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .25s; }
  #flash.on { opacity:.8; transition:none; }

  #rotate { display:none; position:fixed; inset:0; z-index:5; background:#4c1d95; color:#fff; align-items:center; justify-content:center; text-align:center; font-size:22px; font-weight:800; }
  #rotate .icon { font-size:60px; display:block; animation:tilt 1.6s ease-in-out infinite; }
  @keyframes tilt { 0%, 100% { transform:rotate(0); } 50% { transform:rotate(90deg); } }
  @media (orientation: portrait) { body.mode-pad #rotate { display:flex; } }

  #join { display:none; position:fixed; inset:0; z-index:4; background:var(--bg); align-items:center; justify-content:center; flex-direction:column; gap:14px; padding:20px; text-align:center; }
  #join.show { display:flex; }
  #join input { font-size:28px; letter-spacing:.3em; text-transform:uppercase; width:200px; text-align:center; border:2px solid var(--lav-2); border-radius:12px; padding:10px; font-family:"Fredoka", monospace; }
  #join button { border:0; background:var(--purple); color:#fff; font-size:18px; font-weight:700; border-radius:14px; padding:12px 22px; }

  /* ---- minimal: paper, ink, hairlines; the player's own colour on A and the chip ---- */
  body { background-image:none; font-family:var(--font); }
  .brand { font-family:var(--font); font-weight:600; color:#000; }
  .pill, button.small, .menu button { border-width:1px; border-color:var(--lav-2); border-radius:var(--r); font-weight:500; color:#000; }
  .pill.player { border-color:transparent; color:#fff; }
  button.small.primary { background:#000; border-color:#000; color:#fff; }
  button.small.go { background:var(--purple); border-color:var(--purple); font-family:var(--font); border-radius:999px; }
  .menu button.on { background:#000; border-color:#000; color:#fff; }
  .btn { border-width:1px; border-color:var(--lav-2); box-shadow:none; background:#fff; color:#000; font-family:var(--font); font-weight:500; }
  .btn.pressed { background:#000; border-color:#000; color:#fff; }
  #jump, #btnA { font-family:var(--font); font-weight:600; border-width:2px; }
  #btnB { font-family:var(--font); font-weight:600; }
  #dpad .btn { border-radius:var(--r); }
  #tapPad { border:1px dashed var(--lav-2); background:#fff; border-radius:var(--r); }
  #pad .stick { background:var(--lav); border-color:var(--lav-2); }
  #pad .stick.on { background:#ececee; }
  #pad .stick .jk { background:#000; box-shadow:none; }
  #pad .stick .lbl { color:var(--muted); font-weight:500; }
  #pad .hold { box-shadow:none; }
  .hint b { font-family:var(--font); font-weight:500; }
  #camStatus { border-radius:var(--r); font-weight:500; color:#000; }
  #captureBtn { border-width:2px; border-color:#fff; box-shadow:none; }
  #captureBtn::after { background:var(--purple); }
  #cam, #camCanvas { background:#000; }
  #rotate { background:#000; font-weight:500; }
  #join input { border-width:1px; border-radius:var(--r); font-family:var(--font); }
  #join button { border-radius:999px; background:var(--purple); font-weight:500; }
</style>
<script src="shared/i18n.js"></script>
</head>
<body class="mode-pad">
<div class="top">
  <span class="brand">PlayLab</span>
  <span class="pill connecting" id="status"><span class="dot"></span><span id="statusText">connecting...</span></span>
  <span class="pill player" id="playerChip" style="display:none"><i></i><span id="playerName">Player 1</span></span>
  <span class="spacer"></span>
  <button class="small go" id="playBtn" style="display:none">PLAY!</button>
  <button class="small" id="modeBtn" style="display:none">Controller</button>
  <button class="small" id="fsBtn">Full screen</button>
</div>

<div id="cam" class="mode">
  <canvas id="camCanvas"></canvas>
  <video id="camVideo" playsinline muted autoplay hidden></video>
  <div id="flash"></div>
  <div id="camStatus">Starting camera...</div>
  <button id="captureBtn" title="Capture now" aria-label="Capture now"></button>
</div>

<div id="pad" class="mode">
  <div class="menu"><button id="mRestart" data-i18n="pad.restart">&#8635; Restart</button><button id="mPause" data-i18n="pad.pause">&#10074;&#10074; Pause</button><button id="mMute" data-i18n="pad.sound">&#128266; Sound</button><span id="gameState" data-i18n="pad.noLevel">no level yet</span></div>
  <div class="hint" id="hint"><b><span data-i18n="pad.room">Room</span> <span id="roomCode">----</span></b><span data-i18n="pad.keepOpen">Keep the game open on the computer.</span></div>
  <div class="btn" id="left">&#9664;</div>
  <div class="btn" id="right">&#9654;</div>
  <div class="btn" id="jump" data-i18n="pad.jump">JUMP</div>
  <!-- shooter layout (an arena on the computer): move with the left thumb, aim with the right, FIRE -->
  <div class="stick" id="stickMove"><span class="lbl" data-i18n="pad.move">MOVE</span></div>
  <div class="stick" id="stickAim"><span class="lbl" data-i18n="pad.aim">AIM</span></div>
  <div class="hold" id="fire" data-i18n="pad.fire">FIRE</div>
  <!-- generated games: the layout the game asked for with PlayLab.controller() -->
  <div id="dpad"><div class="btn" id="dUp">&#9650;</div><div class="btn" id="dLeft">&#9664;</div><div class="btn" id="dRight">&#9654;</div><div class="btn" id="dDown">&#9660;</div></div>
  <div class="btn" id="btnB">B</div>
  <div class="btn" id="btnA">A</div>
  <div id="tapPad"><span data-i18n="pad.tapHere">Tap here: the game sees where</span></div>
</div>

<div id="rotate"><div><span class="icon">&#128241;</span><span data-i18n="pad.rotate">Rotate your phone</span></div></div>

<div id="join">
  <div class="brand" style="font-size:26px">PlayLab Pad</div>
  <div style="color:var(--muted)">Type the 4-letter room code shown on the computer</div>
  <input id="codeInput" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="KX7P">
  <button id="joinBtn">Join</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
let client = null;
let mode = "pad";
const state = { l: 0, r: 0, u: 0, d: 0 };

function setStatus(status, detail) {
  const pill = $("status");
  pill.className = "pill " + status;
  const text = { connecting: "connecting..." + (detail === "relay" ? " (relay)" : ""), reconnecting: "reconnecting..." + (detail ? " (" + detail + ")" : ""), connected: "connected" + (detail === "relay" ? " (relay)" : ""), error: "error: " + (detail || "unknown"), waiting: "waiting" }[status] || status;
  $("statusText").textContent = text;
  window.__padStatus = status; window.__padShowState = showState;
  window.__padTransport = client?.transport;
}
function buzz(pattern) { try { navigator.vibrate?.(pattern); } catch {} }
const EVENT_BUZZ = { jump: 15, coin: 30, hit: [60, 40, 90], goal: [80, 50, 80, 50, 200], level: [30, 30, 30], win: [80, 50, 80, 50, 260], lose: [220], explode: [40, 30, 120] };

// Public config (Supabase relay) from the server; the page works without it, just without the fallback.
const configReady = Promise.race([
  fetch("api/config", { cache: "no-store" }).then((r) => r.json()).then((c) => c.relay || null),
  new Promise((r) => setTimeout(() => r(null), 2500)),
]).catch(() => null);

async function join(code) {
  code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
  if (code.length !== 4) { $("join").classList.add("show"); return; }
  $("join").classList.remove("show");
  $("roomCode").textContent = code;
  history.replaceState(null, "", "?room=" + code + (params.get("fakepaper") ? "&fakepaper=1" : ""));
  const relay = await configReady;
  const opts = { relay, forceRelay: params.get("relay") === "1", peerHost: params.get("peerhost") || undefined };
  client = new PhoneLink.Client(code, {
    onStatus: setStatus,
    onTransport: (t) => { window.__padTransport = t; if (t === "relay" && mode === "camera") camStatus("Connected through the relay: controls work, but live video needs a direct connection (same Wi-Fi).", "error"); },
    onWelcome: (w) => {
      document.documentElement.style.setProperty("--player", w.color);
      $("playerName").textContent = `Player ${w.slot} · ${w.name}`;
      $("playerChip").style.display = "";
      $("hint").innerHTML = `<b>You are player ${w.slot}</b>${w.name} on the big screen`;
      $("modeBtn").style.display = "";
      window.__padWelcome = w;
      if (w.mode === "camera") setMode("camera", false); else if (mode !== "camera") setMode("pad", false);
    },
    onEvent: (name) => { window.__padLastEvent = name; window.__padLastEventAt = performance.now(); (window.__padEvents ||= []).push(name); if (EVENT_BUZZ[name]) buzz(EVENT_BUZZ[name]); },
    onState: showState,
    onMessage: onHostMessage,
  }, opts);
  client.start();
  window.__padClient = client;
}

// ---------------------------------------------------------------------------
// Modes: "camera" (scan the paper live for the big screen) and "pad" (controller)
// ---------------------------------------------------------------------------
function setMode(next, tell = true) {
  mode = next;
  document.body.classList.toggle("mode-cam", mode === "camera");
  document.body.classList.toggle("mode-pad", mode === "pad");
  $("modeBtn").textContent = mode === "camera" ? "Controller" : "Back to camera";
  $("modeBtn").classList.toggle("primary", mode === "camera");
  $("playBtn").style.display = mode === "camera" && Cam.level ? "" : "none";
  window.__padMode = mode;
  if (tell) client?.sendMode(mode);
  if (mode === "camera") startCamera(); else stopCamera();
}
$("modeBtn").addEventListener("click", () => setMode(mode === "camera" ? "pad" : "camera"));
$("playBtn").addEventListener("click", () => { buzz(20); setMode("pad"); });

// ---------------------------------------------------------------------------
// Camera pipeline: detect the sheet -> hold still -> capture -> flatten -> ink to the PC + scan
// ---------------------------------------------------------------------------
const Cam = {
  source: null, w: 0, h: 0, raf: 0, stream: null, out: null,
  quad: null, lastQuad: null, steadySince: 0, lastDetect: 0, lastChangeCheck: 0,
  lastMask: null, changed: true, capturing: false, lastCaptureAt: 0,
  seq: 0, scanning: false, pending: null, level: null,
};
const small = document.createElement("canvas"); small.width = 160; small.height = 120;
const sctx = small.getContext("2d", { willReadFrequently: true });
const mid = document.createElement("canvas"); const mctx = mid.getContext("2d", { willReadFrequently: true });
const full = document.createElement("canvas"); const fctx = full.getContext("2d", { willReadFrequently: true });
let lastStatus = "", statusHoldUntil = 0;
/** Routine messages (from the detect loop) are skipped while a result message is on hold. */
function camStatus(text, cls, holdMs = 0) {
  const now = performance.now();
  if (!holdMs && now < statusHoldUntil) return;
  if (holdMs) statusHoldUntil = now + holdMs;
  if (text === lastStatus && (cls || "") === $("camStatus").className) return;
  lastStatus = text;
  const el = $("camStatus"); el.textContent = text; el.className = cls || "";
  window.__camStatus = text;
}

async function startCamera() {
  if (Cam.source) return;
  camStatus("Starting camera...", "busy");
  if (params.get("fakepaper") === "1") { Cam.source = makeFakePaper(); Cam.w = Cam.source.width; Cam.h = Cam.source.height; }
  else {
    if (!navigator.mediaDevices?.getUserMedia) {
      camStatus(location.protocol === "http:" ? "The camera needs HTTPS. Open the https:// address (or the vercel.app site) on your phone." : "This browser has no camera access.", "error");
      return;
    }
    try {
      Cam.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    } catch (err) { camStatus(`Camera blocked (${err.name}). Allow camera access for this site and reload.`, "error"); return; }
    const v = $("camVideo"); v.srcObject = Cam.stream;
    try { await v.play(); } catch {}
    await new Promise((r) => { if (v.videoWidth) r(); else v.addEventListener("loadedmetadata", r, { once: true }); });
    Cam.source = v; Cam.w = v.videoWidth; Cam.h = v.videoHeight;
  }
  const c = $("camCanvas"), ctx = c.getContext("2d");
  const scale = Math.min(1, 960 / Cam.w);
  c.width = Math.round(Cam.w * scale); c.height = Math.round(Cam.h * scale);
  const draw = () => {
    if (Cam.source.videoWidth === 0 && !Cam.source.getContext) { Cam.raf = requestAnimationFrame(draw); return; }
    if (Cam.source.tick) Cam.source.tick();
    ctx.drawImage(Cam.source, 0, 0, c.width, c.height);
    detectStep(performance.now());
    if (Cam.quad) {
      ctx.save(); ctx.lineWidth = 5; ctx.strokeStyle = Cam.changed ? "#22c55e" : "#a78bfa"; ctx.lineJoin = "round"; ctx.setLineDash(Cam.changed ? [] : [14, 10]);
      ctx.beginPath(); Cam.quad.forEach(([x, y], i) => ctx[i ? "lineTo" : "moveTo"](x * scale, y * scale)); ctx.closePath(); ctx.stroke(); ctx.restore();
      if (Cam.progress > 0 && Cam.progress < 1) { ctx.save(); ctx.lineWidth = 6; ctx.strokeStyle = "#22c55e"; ctx.beginPath(); ctx.arc(c.width / 2, 40, 18, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Cam.progress); ctx.stroke(); ctx.restore(); }
    }
    window.__camFrames = (window.__camFrames || 0) + 1;
    Cam.raf = requestAnimationFrame(draw);
  };
  draw();
  Cam.out = c.captureStream(24);
  if (client && !client.canStreamVideo) camStatus("Connected through the relay: controls work, but live video needs a direct connection (same Wi-Fi).", "error");
  else { client?.startVideo(Cam.out); camStatus("Point the camera at your drawing", "live"); }
}
function stopCamera() {
  cancelAnimationFrame(Cam.raf);
  client?.stopVideo();
  if (Cam.stream) { for (const t of Cam.stream.getTracks()) t.stop(); Cam.stream = null; }
  Cam.source = null; Cam.out = null; Cam.quad = null; Cam.lastQuad = null; Cam.progress = 0;
}

function detectStep(now) {
  if (now - Cam.lastDetect < 100) return;
  Cam.lastDetect = now;
  sctx.drawImage(Cam.source, 0, 0, 160, 120);
  const det = Paper.detectPaper(sctx.getImageData(0, 0, 160, 120));
  const raw = det ? det.quad.map(([x, y]) => [x * Cam.w / 160, y * Cam.h / 120]) : null;
  if (!(raw && Cam.lastQuad && Paper.quadDistance(raw, Cam.lastQuad) < 0.012 * Cam.w)) { Cam.steadySince = now; Cam.quadHist = []; }
  Cam.lastQuad = raw;
  // Detection runs on a 160x120 frame (8 px steps); average the last few quads while steady to remove that jitter.
  let quad = raw;
  if (raw) { (Cam.quadHist ||= []).push(raw); if (Cam.quadHist.length > 4) Cam.quadHist.shift(); const n = Cam.quadHist.length; quad = raw.map((_, i) => [Cam.quadHist.reduce((s, q) => s + q[i][0], 0) / n, Cam.quadHist.reduce((s, q) => s + q[i][1], 0) / n]); }
  Cam.quad = quad; Cam.progress = 0;
  window.__camQuad = quad;
  if (!quad) { if (!Cam.capturing && !Cam.scanning) camStatus("Point the camera at the paper", "live"); return; }
  const steadyFor = now - Cam.steadySince;
  // After a capture, watch the ink for changes (every 700 ms while roughly steady). Two hits in a row
  // (ignoring one-pixel edge jitter) count as "the drawing changed".
  if (Cam.lastMask && steadyFor > 300 && now - Cam.lastChangeCheck > 700 && !Cam.capturing) {
    Cam.lastChangeCheck = now;
    const d = Paper.bestDiff(Cam.lastMask, quickMask(quad), 200, 150, 1, 2);
    window.__camDiff = d;
    Cam.changeHits = d > 0.002 ? (Cam.changeHits || 0) + 1 : 0;
    if (Cam.changeHits >= 2) Cam.changed = true;
  }
  const need = Cam.lastMask ? 1500 : 1000;
  if (Cam.changed) {
    Cam.progress = Math.min(1, steadyFor / need);
    if (steadyFor >= need && !Cam.capturing && now - Cam.lastCaptureAt > 2500) capture("auto");
    else if (!Cam.scanning) camStatus(steadyFor > 150 ? "Hold still..." : (Cam.lastMask ? "Drawing changed, hold still" : "Paper found"), "live");
  } else if (!Cam.scanning) camStatus("Watching for changes. Keep drawing!", "live");
}
/** Small flattened ink mask of the current frame (for change detection). */
function quickMask(quad) {
  const s = Math.min(1, 640 / Cam.w);
  mid.width = Math.round(Cam.w * s); mid.height = Math.round(Cam.h * s);
  mctx.drawImage(Cam.source, 0, 0, mid.width, mid.height);
  const img = mctx.getImageData(0, 0, mid.width, mid.height);
  const flat = Paper.boostContrast(Paper.warp(img, quad.map(([x, y]) => [x * s, y * s]), 200, 150));
  return Paper.inkMask(flat).mask;
}
$("captureBtn").addEventListener("click", () => { if (Cam.quad && !Cam.capturing) capture("manual"); });

function capture(kind) {
  if (!Cam.quad || !Cam.source) return;
  Cam.capturing = true;
  const quad = Cam.quad;
  try {
    const scale = Math.min(1, 1600 / Cam.w);
    full.width = Math.round(Cam.w * scale); full.height = Math.round(Cam.h * scale);
    fctx.drawImage(Cam.source, 0, 0, full.width, full.height);
    const src = fctx.getImageData(0, 0, full.width, full.height);
    const flat = Paper.boostContrast(Paper.warp(src, quad.map(([x, y]) => [x * scale, y * scale]), 1200, 900));
    const flatCanvas = document.createElement("canvas"); flatCanvas.width = 1200; flatCanvas.height = 900;
    flatCanvas.getContext("2d").putImageData(new ImageData(flat.data, 1200, 900), 0, 0);
    const jpeg = flatCanvas.toDataURL("image/jpeg", 0.85);
    const tc = document.createElement("canvas"); tc.width = 720; tc.height = 540; tc.getContext("2d").drawImage(flatCanvas, 0, 0, 720, 540);
    const thumb = tc.toDataURL("image/jpeg", 0.75);   // also the source of the drawn art in the game
    // ink mask for the instant layer on the PC, and the change-detection reference (same path as quickMask)
    const IW = 600, IH = 450;
    const inkImg = Paper.inkMask(Paper.downsample(flat, IW, IH));
    Cam.lastMask = quickMask(quad);
    Cam.changed = false; Cam.changeHits = 0; Cam.progress = 0;
    const ic = document.createElement("canvas"); ic.width = IW; ic.height = IH;
    ic.getContext("2d").putImageData(new ImageData(Paper.maskToRGBA(inkImg.mask, IW, IH), IW, IH), 0, 0);
    const png = ic.toDataURL("image/png");
    Cam.seq++; Cam.lastCaptureAt = performance.now();
    window.__camCaptures = (window.__camCaptures || 0) + 1;
    $("flash").classList.add("on"); setTimeout(() => $("flash").classList.remove("on"), 60);
    buzz(20);
    client?.sendLarge({ t: "ink", seq: Cam.seq, w: IW, h: IH, png, count: inkImg.count, kind });
    camStatus("Captured! Reading your drawing...", "busy", 1500);
    queueScan({ jpeg, thumb, seq: Cam.seq });
  } catch (err) {
    camStatus("Capture failed: " + err.message, "error");
  }
  Cam.capturing = false;
}

function queueScan(job) { if (Cam.scanning) { Cam.pending = job; return; } runScan(job); }
const strip = (l) => ({ theme: l.theme, aspect: l.aspect, objects: l.objects.map(({ type, label, x, y, w, h }) => ({ type, label, x, y, w, h })) });
// The phone never calls the AI itself: it hands the picture to the computer, which scans it with the logged-in
// account (and its credits) and answers with "scan-result". Phones need no account.
const pendingScans = new Map();   // seq -> { resolve, reject }
function onHostMessage(msg) {
  if (msg.t !== "scan-result") return;
  const p = pendingScans.get(msg.seq); if (!p) return;
  pendingScans.delete(msg.seq);
  if (msg.ok && (msg.level || msg.code)) p.resolve(msg); else p.reject(new Error(msg.error || "scan failed"));   // code: the computer writes it as AI code
}
function requestScan(job) {
  return new Promise((resolve, reject) => {
    if (!client?.connected) return reject(new Error("not connected to the computer"));
    pendingScans.set(job.seq, { resolve, reject });
    client.sendLarge({ t: "scan", seq: job.seq, image: job.jpeg, thumb: job.thumb });
    setTimeout(() => { if (pendingScans.delete(job.seq)) { const e = new Error("the computer did not answer"); e.name = "TimeoutError"; reject(e); } }, 100_000);
  });
}
async function runScan(job) {
  Cam.scanning = true;
  window.__camScans = (window.__camScans || 0) + 1;
  try {
    const data = await requestScan(job);
    if (data.code) { camStatus(data.busy ? "The computer is still busy with the last picture" : "Sent: AI code is reading your drawing on the computer", "live", 6000); buzz([20, 30, 20]); Cam.scanning = false; return; }
    Cam.level = data.level;
    window.__camLevel = data.level;
    const d = data.level.diff;
    camStatus(d && d.short ? `Level updated: ${d.short}` : d ? "No changes spotted" : `${data.level.objects.length} objects found! Building on the big screen...`, "live", 4500);
    if (mode === "camera") $("playBtn").style.display = "";
    buzz([20, 30, 20]);
  } catch (err) {
    camStatus("Scan failed: " + (err.name === "TimeoutError" ? "the AI took too long" : err.message), "error", 6000);
  }

  if (Cam.pending) { const j = Cam.pending; Cam.pending = null; runScan(j); }

/** Test/demo source (?fakepaper=1): a canvas that looks like a desk with a sheet and a drawing; hand shake settles after 2 s. */
function makeFakePaper() {
  const c = document.createElement("canvas"); c.width = 1280; c.height = 960;
  const ctx = c.getContext("2d"); const t0 = performance.now();
  c.tick = () => {
    const t = (performance.now() - t0) / 1000;
    const shake = t < 2 ? 40 : 0.6;
    const jx = Math.sin(t * 9) * shake, jy = Math.cos(t * 7) * shake;
    ctx.fillStyle = "#3a3a44"; ctx.fillRect(0, 0, 1280, 960);
    for (let i = 0; i < 300; i++) { ctx.fillStyle = i % 2 ? "#44444f" : "#30303a"; ctx.fillRect((i * 97) % 1280, (i * 61) % 960, 6, 6); }
    ctx.save(); ctx.translate(640 + jx, 480 + jy); ctx.rotate(0.06);
    ctx.fillStyle = "#f3f0e6"; ctx.fillRect(-440, -330, 880, 660);
    ctx.strokeStyle = "#1b1535"; ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.beginPath(); ctx.moveTo(-380, 220); ctx.lineTo(380, 225); ctx.stroke();                       // ground
    ctx.beginPath(); ctx.arc(-300, 120, 22, 0, Math.PI * 2); ctx.moveTo(-300, 142); ctx.lineTo(-300, 200); ctx.moveTo(-300, 200); ctx.lineTo(-325, 222); ctx.moveTo(-300, 200); ctx.lineTo(-275, 222); ctx.moveTo(-300, 160); ctx.lineTo(-330, 185); ctx.moveTo(-300, 160); ctx.lineTo(-270, 185); ctx.stroke();  // stick figure
    ctx.strokeRect(-60, 160, 100, 62); ctx.strokeRect(120, 90, 90, 132);                                // boxes
    ctx.beginPath(); ctx.moveTo(300, 222); ctx.lineTo(300, 40); ctx.lineTo(370, 70); ctx.lineTo(300, 100); ctx.stroke();   // flag
    ctx.beginPath(); ctx.moveTo(-200, 20); ctx.lineTo(0, 20); ctx.stroke();                              // ledge
    if (window.__fakeAddStroke) { ctx.beginPath(); ctx.arc(-100, -40, 18, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(-40, -40, 18, 0, Math.PI * 2); ctx.stroke(); }   // two coins drawn later
    ctx.restore();
  };
  c.tick();
  return c;
}

// Buttons: each tracks its own pointers so two thumbs work at once.
function bind(id, onDown, onUp) {
  const el = $(id), active = new Set();
  el.addEventListener("pointerdown", (e) => { e.preventDefault(); active.add(e.pointerId); el.classList.add("pressed"); onDown(); });
  const release = (e) => { if (!active.delete(e.pointerId)) return; if (!active.size) { el.classList.remove("pressed"); onUp(); } };
  for (const ev of ["pointerup", "pointercancel", "pointerleave"]) el.addEventListener(ev, release);
  for (const ev of ["pointerup", "pointercancel"]) window.addEventListener(ev, release);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
}
const sendInput = () => client?.sendInput(state);
// Shooter controls: both sticks in one message, FIRE as a hold. The computer forwards them to the arena.
Joystick.css();
const sticks = { m: [0, 0], a: [0, 0] };
let stickTimer = null, stickDirty = false;
function queueSticks(now = false) {
  stickDirty = true; window.__padStick = { m: [...sticks.m], a: [...sticks.a] };
  if (stickTimer && !now) return;
  const flush = () => { stickTimer = null; if (!stickDirty) return; stickDirty = false; client?.send({ t: "stick", m: sticks.m.map((v) => +v.toFixed(2)), a: sticks.a.map((v) => +v.toFixed(2)) }); };
  if (now) { clearTimeout(stickTimer); flush(); } else stickTimer = setTimeout(flush, 40);
}
Joystick.stick($("stickMove"), ({ x, y, active }) => { sticks.m = [x, y]; queueSticks(!active); });
Joystick.stick($("stickAim"), ({ x, y, active }) => { sticks.a = [x, y]; queueSticks(!active); });
Joystick.button($("fire"), () => { window.__padFire = true; client?.send({ t: "fire", down: true }); buzz(8); }, () => { window.__padFire = false; client?.send({ t: "fire", down: false }); });
bind("left", () => { state.l = 1; sendInput(); }, () => { state.l = 0; sendInput(); });
bind("right", () => { state.r = 1; sendInput(); }, () => { state.r = 0; sendInput(); });
bind("jump", () => { window.__padPressAt = performance.now(); client?.sendJump(true); buzz(10); }, () => client?.sendJump(false));
// generated games: the d-pad sends input with up and down, A travels as jump and B as fire (the host turns them into A and B)
bind("dUp", () => { state.u = 1; sendInput(); buzz(6); }, () => { state.u = 0; sendInput(); });
bind("dDown", () => { state.d = 1; sendInput(); buzz(6); }, () => { state.d = 0; sendInput(); });
bind("dLeft", () => { state.l = 1; sendInput(); buzz(6); }, () => { state.l = 0; sendInput(); });
bind("dRight", () => { state.r = 1; sendInput(); buzz(6); }, () => { state.r = 0; sendInput(); });
bind("btnA", () => { window.__padPressAt = performance.now(); client?.sendJump(true); buzz(10); }, () => client?.sendJump(false));
bind("btnB", () => { client?.send({ t: "fire", down: true }); buzz(8); }, () => client?.send({ t: "fire", down: false }));
$("tapPad").addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const r = $("tapPad").getBoundingClientRect(), nx = (e.clientX - r.left) / r.width, ny = (e.clientY - r.top) / r.height;
  client?.send({ t: "tap", nx: +Math.max(0, Math.min(1, nx)).toFixed(3), ny: +Math.max(0, Math.min(1, ny)).toFixed(3) }); buzz(8);
  const dot = document.createElement("i"); dot.style.left = e.clientX - r.left + "px"; dot.style.top = e.clientY - r.top + "px"; $("tapPad").appendChild(dot); setTimeout(() => dot.remove(), 500);
});
/** The layouts a generated game can ask for (shared/padroute.mjs CODE_LAYOUTS, copied here: this page loads no modules). */
const CODE_LAYOUTS = { "dpad+jump": { pad: "dpad", a: "JUMP", b: null }, "dpad+2buttons": { pad: "dpad", a: "A", b: "B" }, "stick+2buttons": { pad: "stick", a: "A", b: "B" }, "stick+fire": { pad: "twin", a: null, b: "FIRE" }, "steering+gas+brake": { pad: "steer", a: "GAS", b: "BRAKE" }, "tap": { pad: "tap", a: null, b: null } };
let codePad = null;
function setCodeLayout(name) {
  const L = CODE_LAYOUTS[name] || null, key = L ? name : null;
  if (key === codePad) return;
  codePad = key; window.__padLayout = key;
  const b = document.body.classList;
  b.toggle("code", !!L);
  for (const p of ["dpad", "stick", "twin", "steer", "tap"]) b.toggle("pad-" + p, !!L && L.pad === p);
  b.toggle("has-a", !!L?.a); b.toggle("has-b", !!L?.b && L.pad !== "twin");   // twin sticks: FIRE is the hold button, not B
  if (L?.a) $("btnA").textContent = L.a;
  if (L?.b) { $("btnB").textContent = L.b; $("fire").textContent = L.b; } else $("fire").textContent = I18N.t("pad.fire");
  // nothing stays pressed across a layout change
  state.l = state.r = state.u = state.d = 0; sendInput(); client?.sendJump(false); client?.send({ t: "fire", down: false });
}

// Menu buttons: the game answers with a state message (level, coins, paused, who plays).
const menu = (action) => { buzz(15); client?.send({ t: "menu", action }); };
$("mRestart").addEventListener("click", () => menu("restart"));
$("mPause").addEventListener("click", () => menu("toggle-pause"));
$("mMute").addEventListener("click", () => menu("mute"));
function showState(s) {
  window.__padState = s;
  setCodeLayout(s.layout);
  if (codePad) { showCodeState(s); return; }
  const arena = s.layout === "arena";
  document.body.classList.toggle("layout-arena", arena);
  $("hint").style.display = arena ? "none" : "";
  const label = { play: "playing", paused: "paused", dead: arena ? "you fell!" : "ouch!", won: arena ? "you survived!" : "level complete!", ready: "tap FIRE to start", none: "no level yet" }[s.state] || s.state;
  $("gameState").textContent = arena
    ? (s.theme || "arena") + " \u00B7 wave " + s.wave + "/" + s.waves + " \u00B7 \u2764 " + s.hp + " \u00B7 \uD83D\uDD2B " + s.ammo + " \u00B7 " + label
    : s.level || s.theme ? (s.level || s.theme) + " \u00B7 coins " + s.coins + "/" + s.total + " \u00B7 " + label : label;
  $("mPause").innerHTML = I18N.t(s.state === "paused" ? "pad.resume" : "pad.pause");
  $("mPause").classList.toggle("on", s.state === "paused");
  $("mMute").innerHTML = I18N.t(s.muted ? "pad.muted" : "pad.sound");
  $("mMute").classList.toggle("on", !!s.muted);
  if (s.kit !== undefined) applyKit(s.kit);
}
/** A generated game's state (the PlayLab SDK): its title, score, lives, laps, timer and whether it plays, is paused or over. */
function showCodeState(s) {
  const h = s.hud || {}, parts = [s.level || "game"];
  if (h.score !== undefined) parts.push("score " + h.score);
  if (h.lives !== undefined) parts.push("\u2764 " + h.lives);
  if (h.laps !== undefined) parts.push("lap " + h.laps);
  if (h.timer !== undefined) { const t = Math.max(0, Math.round(Number(h.timer) || 0)); parts.push(Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0")); }
  parts.push({ play: "playing", paused: "paused", over: "game over: press " + (CODE_LAYOUTS[s.layout]?.a || "A") + " to play again" }[s.state] || s.state || "");
  $("gameState").textContent = parts.join(", ");
  $("hint").style.display = "";
  $("mPause").innerHTML = I18N.t(s.state === "paused" ? "pad.resume" : "pad.pause");
  $("mPause").classList.toggle("on", s.state === "paused");
  $("mMute").innerHTML = I18N.t(s.muted ? "pad.muted" : "pad.sound");
  $("mMute").classList.toggle("on", !!s.muted);
}
/** The game's UI kit on the pad: the uploaded button as the buttons' face, its colour for the rest. */
function applyKit(kit) {
  const on = !!(kit && typeof kit.button === "string" && /^data:image\//.test(kit.button));
  document.body.classList.toggle("kit", on);
  const root = document.documentElement.style;
  if (on) { root.setProperty("--pad-btn", `url(${kit.button})`); if (/^#[0-9a-f]{6}$/i.test(kit.color || "")) { root.setProperty("--purple", kit.color); root.setProperty("--purple-deep", kit.color); } }
  else { root.removeProperty("--pad-btn"); root.removeProperty("--purple"); root.removeProperty("--purple-deep"); }
}

// Keyboard too (handy on a laptop for testing)
const KEYS = { ArrowLeft: "l", KeyA: "l", ArrowRight: "r", KeyD: "r" }, CODE_KEYS = { ArrowUp: "u", KeyW: "u", ArrowDown: "d", KeyS: "d" };
const jumpKey = (code) => code === "Space" || (!codePad && (code === "ArrowUp" || code === "KeyW"));
const fireKey = (code) => codePad && (code === "KeyX" || code === "ShiftLeft");
window.addEventListener("keydown", (e) => { if (e.repeat || mode !== "pad") return; if (KEYS[e.code]) { state[KEYS[e.code]] = 1; sendInput(); } if (codePad && CODE_KEYS[e.code]) { state[CODE_KEYS[e.code]] = 1; sendInput(); } if (jumpKey(e.code)) client?.sendJump(true); if (fireKey(e.code)) client?.send({ t: "fire", down: true }); });
window.addEventListener("keyup", (e) => { if (mode !== "pad") return; if (KEYS[e.code]) { state[KEYS[e.code]] = 0; sendInput(); } if (codePad && CODE_KEYS[e.code]) { state[CODE_KEYS[e.code]] = 0; sendInput(); } if (jumpKey(e.code)) client?.sendJump(false); if (fireKey(e.code)) client?.send({ t: "fire", down: false }); });

// Full screen + landscape lock, keep the screen awake
$("fsBtn").addEventListener("click", async () => {
  try { await document.documentElement.requestFullscreen(); } catch {}
  try { await screen.orientation.lock("landscape"); } catch {}
});
let wakeLock = null;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { keepAwake(); if (client && !client.connected) client.retry(); }
  else { state.l = state.r = state.u = state.d = 0; sendInput(); client?.sendJump(false); sticks.m = [0, 0]; sticks.a = [0, 0]; queueSticks(true); client?.send({ t: "fire", down: false }); }
});
keepAwake();

$("joinBtn").addEventListener("click", () => join($("codeInput").value));
$("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") join(e.target.value); });
join(params.get("room"));
