<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1535">
<title>Explore games · Sakanfar PlayLab</title>
<meta name="description" content="Games made in PlayLab, each written as code by Meta's Muse Wonder: racing, puzzles, platformers, shooters and more. Play them in your browser, no account needed.">
<meta property="og:title" content="Explore PlayLab games">
<meta property="og:description" content="Any game, written as code by AI in minutes. Play them in your browser.">
<meta property="og:image" content="https://sakanfarplaylab.vercel.app/assets/logo.webp">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/play.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html"><img src="assets/mark-256.webp" alt="">PlayLab</a>
  <span class="spacer"></span>
  <a class="tb primary" href="studio.html">Make your own</a>
</header>
<main class="explore">
  <h1>Explore</h1>
  <p class="sub">Games made in PlayLab. Tap one to play, no account needed.</p>
  <div class="filters">
    <span class="seg" id="sortSeg"><button data-sort="trending" class="on">Trending</button><button data-sort="newest">Newest</button><button data-sort="featured">Featured</button></span>
    <span class="seg" id="kindSeg" hidden><button data-kind="" class="on">All</button></span>
    <input type="search" id="q" placeholder="Search titles, makers...">
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>No games here yet. <a href="studio.html">Make the first one</a>.</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const KIND = { "2d": ["2D", "&#127918;"], "3d": ["3D", "&#129513;"], arena: ["ARENA", "&#127919;"], code: ["AI CODE", "&#128187;"] };
const state = { sort: "trending", kind: "", q: "" };
function readUrl() { const u = new URLSearchParams(location.search); if (["trending", "newest", "featured"].includes(u.get("sort"))) state.sort = u.get("sort"); if (["2d", "3d", "arena", "code"].includes(u.get("kind"))) state.kind = u.get("kind"); state.q = u.get("q") || ""; }
function writeUrl() { const u = new URLSearchParams(); if (state.sort !== "trending") u.set("sort", state.sort); if (state.kind) u.set("kind", state.kind); if (state.q) u.set("q", state.q); history.replaceState(null, "", location.pathname + (u.toString() ? "?" + u : "")); }
function paint() {
  $("sortSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.sort === state.sort));
  $("kindSeg").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.kind === state.kind));
  $("q").value = state.q;
}
async function load() {
  paint(); writeUrl();
  const u = new URLSearchParams({ action: "explore", sort: state.sort }); if (state.kind) u.set("kind", state.kind); if (state.q) u.set("q", state.q);
  let games = [];
  try { ({ games } = await (await fetch("api/play?" + u, { cache: "no-store" })).json()); } catch {}
  window.__explore = games;
  $("grid").innerHTML = (games || []).map((g) => `<a class="card" href="play/${esc(g.id)}">
    <div class="cover">${g.cover ? `<img src="${esc(g.cover)}" alt="" loading="lazy">` : (KIND[g.kind] || KIND["2d"])[1]}</div>
    <span class="tag">${(KIND[g.kind] || KIND["2d"])[0]}</span>${g.featured ? `<span class="star">&#9733; FEATURED</span>` : ""}
    <div class="meta"><b>${esc(g.title)}</b><small>by ${esc(g.author)}</small>${g.description ? `<small>${esc(g.description).slice(0, 90)}</small>` : ""}<span class="n"><span>&#9654; ${g.plays}</span><span>&#9829; ${g.likes}</span></span></div></a>`).join("");
  $("empty").hidden = (games || []).length > 0;
}
$("sortSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.sort = b.dataset.sort; load(); } });
$("kindSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) { state.kind = b.dataset.kind; load(); } });
$("q").addEventListener("input", () => { state.q = $("q").value.trim(); clearTimeout(load.t); load.t = setTimeout(load, 300); });
readUrl(); load();
</script>
</body>
</html>
